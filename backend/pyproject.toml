[project]
name = "source-trace-backend"
version = "0.1.0"
description = "SourceTrace backend: validated workspace snapshots, bounded PDF extraction, opt-in AI broker"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pypdf",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
